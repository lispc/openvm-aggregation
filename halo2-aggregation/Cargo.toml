[package]
name = "halo2-aggregation"
version = "0.1.0"
edition = "2021"

[dependencies]

snark-verifier-sdk = { git = "https://github.com/axiom-crypto/snark-verifier", branch = "zkvm-v0.1", default-features = false, features = [
    "loader_evm",
    "halo2-axiom",
] }

halo2curves-axiom = { version = "0.5.3" } 

serde = { version = "1.0.201", default-features = false, features = ["derive"] }
serde_json = "1.0.117"
serde_with = "3.11.0"

openvm = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83", package = "openvm", features = ["std"] }
openvm-platform = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83"  }
openvm-keccak256-guest = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83" }
openvm-algebra-complex-macros = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83" }
openvm-snark-verifier = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83" }
openvm-pairing-guest = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83", features = [
    "bn254",
] }
openvm-ecc-guest = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83", features = ["halo2curves","k256"] }
openvm-algebra-guest = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83", features = ["halo2curves"] }
openvm-bigint-guest = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83", features = [
    "export-intrinsics",
] }


bitcode = { version = "0.6.3", default-features = false, features = ["serde"] }
getrandom = { version = "*", features = ["custom"] } # just for disable

[features]
default = []
