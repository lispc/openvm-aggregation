[package]
name = "utils"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

bitcode = { version = "0.6.3", default-features = false, features = ["serde"] }
#openvm-native-recursion = { workspace = true, features = ["static-verifier"] }
openvm-native-recursion = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83", features = ["static-verifier"] }
openvm-sdk = { git = "https://github.com/openvm-org/openvm.git", rev = "074cb83" }
snark-verifier-sdk = { git = "https://github.com/axiom-crypto/snark-verifier", branch = "zkvm-v0.1", default-features = false, features = [
    "loader_halo2",
    "halo2-axiom",
    "display",
] }
