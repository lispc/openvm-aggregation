[package]
name = "utils"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

serde = { version = "1.0.201", default-features = false, features = ["derive"] }
serde_json = "1.0.117"
serde_with = "3.11.0"

halo2curves-axiom = { version = "0.5.3" } 
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "b0591e9" }
bitcode = { version = "0.6.3", default-features = false, features = ["serde"] }
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", rev = "8c9f94" }
#openvm-stark-sdk = { path = "/home/ubuntu/zzhang/openvm/crates/sdk" }
